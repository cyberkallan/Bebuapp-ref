# Edge-mode override: the host already runs a reverse proxy that owns ports
# 80/443 and terminates TLS. bebu's Caddy then publishes nothing and joins the
# shared network as `bebu-edge`, which the host proxy forwards to on port 80.
#
#   deploy.sh adds this file automatically when EDGE_NETWORK is set in .env.
services:
  caddy:
    container_name: bebu-edge
    ports: !override []
    networks:
      internal: {}
      edge:
        aliases: [bebu-edge]

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:?set EDGE_NETWORK to the shared proxy network}
