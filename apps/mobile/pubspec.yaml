name: bebu_mobile
description: bebu - real-time 1-to-1 voice and video calling. White-label Flutter client; one build per tenant via flavors.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

# Only what the foundation stage uses. Stage dependencies are added when the
# feature lands so the APK never carries unused native code:
#   auth          -> firebase_core, firebase_auth, flutter_secure_storage
#   calls         -> agora_rtc_engine, permission_handler
#   notifications -> firebase_messaging, flutter_local_notifications
#   payments      -> in_app_purchase
dependencies:
  flutter:
    sdk: flutter

  # State & DI
  flutter_riverpod: ^3.4.3
  # Navigation
  go_router: ^18.0.1
  # HTTP (interceptors for tenant key, auth, request id)
  dio: ^5.7.0
  # Device-local preferences (server override, later: onboarding flags)
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
