# bebu stack: MongoDB + backend API + admin panel behind a Caddy edge that
# terminates HTTPS itself (Let's Encrypt, automatic).
#
#   ./install.sh                      # guided first-time setup (writes .env, builds, starts)
#   docker compose up -d --build      # later: rebuild + restart after a code change
#
# Behind an existing reverse proxy on the same host? Add the override:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.edge.yml   (in .env)
name: ${STACK_NAME:-bebu}

x-logging: &default-logging
  driver: json-file
  options: { max-size: '20m', max-file: '5' }

services:
  mongo:
    image: mongo:7
    container_name: ${STACK_NAME:-bebu}-mongo
    restart: unless-stopped
    command: ['--wiredTigerCacheSizeGB', '0.5']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *default-logging

  backend:
    build: ../backend
    # Fixed container names: the edge may also sit on a shared network where
    # plain service names like `admin` belong to other projects.
    container_name: ${STACK_NAME:-bebu}-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MongoDb_Connection_String: mongodb://mongo:27017/${MONGO_DB:-bebu}
      secretKey: ${SECRET_KEY:?set SECRET_KEY}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      # Encrypts admin passwords at rest. Generated once by install.sh; never change it later.
      ADMIN_PASSWORD_KEY: ${ADMIN_PASSWORD_KEY:-}
      # First boot: the Firebase service account is copied into the Settings
      # document from this file (see install.sh). Later edits happen in the
      # admin panel (Settings → General → Firebase private key).
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
      # Optional first-boot values; all editable in the admin panel afterwards.
      ZEGO_APP_ID: ${ZEGO_APP_ID:-}
      ZEGO_APP_SIGN: ${ZEGO_APP_SIGN:-}
      # Envato purchase-code check at admin sign-up. Leave the token empty to
      # accept any code (self-hosted).
      ENVATO_PERSONAL_TOKEN: ${ENVATO_PERSONAL_TOKEN:-}
      ENVATO_ITEM_ID: ${ENVATO_ITEM_ID:-}
      # Folder the admin Downloads page serves (release zips, APK/AAB, source).
      DOWNLOADS_DIR: /app/storage/downloads
    volumes:
      - backend-storage:/app/storage
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    depends_on:
      mongo: { condition: service_healthy }
    networks: [internal]
    logging: *default-logging

  admin:
    container_name: ${STACK_NAME:-bebu}-admin
    build:
      context: ../admin
      args:
        NEXT_PUBLIC_BASE_URL: ${PUBLIC_URL:?set PUBLIC_URL}
        NEXT_PUBLIC_SECRET_KEY: ${SECRET_KEY}
        NEXT_PUBLIC_PROJECT_NAME: ${PROJECT_NAME:-bebu}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${PUBLIC_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      secretKey: ${SECRET_KEY}
      API_URL: http://${STACK_NAME:-bebu}-backend:5000/api
    depends_on: [backend]
    networks: [internal]
    logging: *default-logging

  edge:
    image: caddy:2-alpine
    container_name: ${STACK_NAME:-bebu}-edge
    restart: unless-stopped
    environment:
      # DOMAIN examples: api.example.com  (automatic HTTPS)
      #                  http://203.0.113.10  (plain HTTP, for a quick trial)
      DOMAIN: ${DOMAIN:?set DOMAIN}
      STACK_NAME: ${STACK_NAME:-bebu}
    ports:
      - '${HTTP_BIND:-80}:80'
      - '${HTTPS_BIND:-443}:443'
      - '${HTTPS_BIND:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend, admin]
    networks: [internal]
    logging: *default-logging

volumes:
  mongo-data:
  backend-storage:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
